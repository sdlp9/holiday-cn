name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点自动执行
  workflow_dispatch: # 允许在 Actions 页面手动点击触发

# 显式声明授予写权限，双重保险
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true # 必须设为 true，后续同步才持有写入凭证

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-Action@v3.4.1
        with:
          upstream_sync_repo: 'NateScarlet/holiday-cn' 
          upstream_sync_branch: 'master'           # 上游的分支名（如 main 或 master）
          target_sync_branch: 'master'             # 你的分支名（如 main 或 master）
          test_mode: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
