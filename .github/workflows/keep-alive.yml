
name: Keep Alive Task

on:
  schedule:
    - cron: '0 0 1 */2 *' # 每两个月的1号运行一次（约60天内）
  workflow_dispatch:      # 允许手动触发

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 必须赋予写入权限以允许提交代码
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Keep Alive Action
        # 使用社区成熟的保活插件
        uses: gautamkrishnar/keepalive-workflow@v1 
